<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 小压缩工具</title>
    <style>
        :root {
            --primary: #6d5dfc;
            --primary-dark: #5245d8;
            --primary-soft: #eeecff;
            --success: #15803d;
            --success-soft: #dcfce7;
            --danger: #dc2626;
            --danger-soft: #fee2e2;
            --text: #172033;
            --muted: #6f7b90;
            --border: #dce3ee;
            --bg: #f4f7fb;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 38px 18px;
            color: var(--text);
            font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
            background:
                radial-gradient(circle at 15% 0%, rgba(109, 93, 252, .15), transparent 34%),
                radial-gradient(circle at 95% 18%, rgba(22, 160, 133, .12), transparent 28%),
                var(--bg);
        }

        .shell { width: min(920px, 100%); margin: 0 auto; }

        header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 24px;
        }

        h1 { margin: 0; font-size: clamp(28px, 5vw, 40px); letter-spacing: -1px; }
        header p { margin: 9px 0 0; color: var(--muted); line-height: 1.6; }

        .limit-badge {
            flex: 0 0 auto;
            padding: 10px 14px;
            border-radius: 999px;
            color: #4338ca;
            background: var(--primary-soft);
            font-size: 13px;
            font-weight: 800;
        }

        .card {
            padding: 28px;
            border: 1px solid rgba(220, 227, 238, .9);
            border-radius: 24px;
            background: rgba(255, 255, 255, .96);
            box-shadow: 0 22px 55px rgba(28, 39, 66, .11);
        }

        .drop-zone {
            min-height: 235px;
            display: grid;
            place-items: center;
            padding: 30px;
            text-align: center;
            border: 2px dashed #abb6c8;
            border-radius: 20px;
            background: #f8faff;
            cursor: pointer;
            transition: .2s ease;
        }

        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: var(--primary);
            background: var(--primary-soft);
            transform: translateY(-2px);
        }

        .icon {
            width: 68px;
            height: 68px;
            display: grid;
            place-items: center;
            margin: 0 auto 14px;
            border-radius: 22px;
            color: white;
            background: linear-gradient(135deg, var(--primary), #22a68b);
            box-shadow: 0 12px 25px rgba(84, 72, 209, .25);
            font-size: 30px;
            font-weight: 900;
        }

        .drop-zone strong { display: block; font-size: 19px; }
        .drop-zone span { display: block; margin-top: 8px; color: var(--muted); font-size: 13px; }
        input[type="file"] { display: none; }

        .field { margin-top: 20px; }
        label { display: block; margin-bottom: 8px; color: #4f5c71; font-size: 13px; font-weight: 800; }

        input[type="text"] {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            background: white;
            font: inherit;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(109, 93, 252, .13);
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 14px 18px;
            border: 0;
            border-radius: 13px;
            color: white;
            background: var(--primary);
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            transition: .18s ease;
        }

        button:hover:not(:disabled) { background: var(--primary-dark); transform: translateY(-1px); }
        button:disabled { cursor: not-allowed; opacity: .48; }

        .explain {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 11px;
            margin-top: 17px;
        }

        .explain div {
            padding: 12px;
            border-radius: 12px;
            color: #506078;
            background: #f4f6fa;
            font-size: 12px;
            line-height: 1.5;
        }

        .results { display: grid; gap: 10px; margin-top: 20px; }

        .result {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 16px;
            align-items: center;
            padding: 14px 16px;
            border-radius: 14px;
            background: #f5f7fb;
        }

        .result-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; }
        .result-detail { margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.55; white-space: pre-line; word-break: break-all; }
        .state { font-size: 13px; font-weight: 800; }
        .state.loading { color: var(--primary); }
        .state.success { color: var(--success); }
        .state.error { color: var(--danger); }

        .summary {
            display: none;
            margin-top: 18px;
            padding: 13px 15px;
            border-radius: 13px;
            font-size: 13px;
            font-weight: 750;
        }

        .summary.show { display: block; }
        .summary.ok { color: var(--success); background: var(--success-soft); }
        .summary.fail { color: var(--danger); background: var(--danger-soft); }

        @media (max-width: 640px) {
            body { padding: 22px 12px 34px; }
            header { align-items: flex-start; flex-direction: column; }
            .card { padding: 18px; }
            .drop-zone { min-height: 200px; padding: 22px 16px; }
            .explain { grid-template-columns: 1fr; }
            .result { grid-template-columns: 1fr; gap: 8px; }
        }
    </style>
</head>
<body>
<main class="shell">
    <header>
        <div>
            <h1>MP3 小压缩</h1>
            <p>在 1.3 MiB 硬限制内自动选择尽可能高的音质，原歌曲文件不会被修改。</p>
        </div>
        <div class="limit-badge">每首 ≤ 1.3 MiB</div>
    </header>

    <section class="card">
        <div class="drop-zone" id="dropZone">
            <div>
                <div class="icon">⇩</div>
                <strong id="dropText">点击或拖入 MP3 文件</strong>
                <span>支持一次处理多首歌曲</span>
            </div>
            <input type="file" id="fileInput" accept="audio/mpeg,.mp3" multiple>
        </div>

        <div class="field">
            <label for="outputDir">保存目录</label>
            <input type="text" id="outputDir" value="D:\Downloads" placeholder="例如 D:\Downloads\小压缩">
        </div>

        <button id="submitBtn" disabled>生成小压缩 MP3</button>

        <div class="explain">
            <div>文件后缀固定为<br><strong>_小压缩.mp3</strong></div>
            <div>已小于限制时优先复制音频流，避免再次损失音质。</div>
            <div>需要压缩时自动计算最高码率，并校验最终实际大小。</div>
        </div>

        <div class="results" id="results"></div>
        <div class="summary" id="summary"></div>
    </section>
</main>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const dropText = document.getElementById('dropText');
    const outputDir = document.getElementById('outputDir');
    const submitBtn = document.getElementById('submitBtn');
    const results = document.getElementById('results');
    const summary = document.getElementById('summary');
    let selectedFiles = [];

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', event => {
        event.preventDefault();
        dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', event => {
        event.preventDefault();
        dropZone.classList.remove('drag-over');
        setFiles(Array.from(event.dataTransfer.files));
    });
    fileInput.addEventListener('change', () => setFiles(Array.from(fileInput.files)));

    function setFiles(files) {
        selectedFiles = files.filter(file =>
            file.type === 'audio/mpeg' || file.name.toLowerCase().endsWith('.mp3')
        );
        dropText.textContent = selectedFiles.length
            ? `已选择 ${selectedFiles.length} 个 MP3 文件`
            : '点击或拖入 MP3 文件';
        submitBtn.disabled = selectedFiles.length === 0;
        results.innerHTML = '';
        hideSummary();
    }

    submitBtn.addEventListener('click', async () => {
        const targetDir = outputDir.value.trim();
        if (!targetDir) {
            showSummary('请填写保存目录', false);
            outputDir.focus();
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = '正在压缩…';
        results.innerHTML = '';
        hideSummary();
        let successCount = 0;

        for (const file of selectedFiles) {
            const item = createResultItem(file);
            results.appendChild(item.root);

            const formData = new FormData();
            formData.append('file', file);
            formData.append('outputDir', targetDir);

            try {
                const response = await fetch('/tool/processSmallMp3', { method: 'POST', body: formData });
                const data = await response.json();
                if (data.code === 200) {
                    successCount++;
                    const mode = data.data.streamCopied ? '无损复制音频流' : `${data.data.bitrateKbps} kbps ABR`;
                    item.detail.textContent = `${formatBytes(file.size)} → ${formatBytes(data.data.fileSize)} · ${mode}\n${data.data.outputPath}`;
                    item.state.textContent = '成功';
                    item.state.className = 'state success';
                } else {
                    item.detail.textContent = data.message || '处理失败';
                    item.state.textContent = '失败';
                    item.state.className = 'state error';
                }
            } catch (error) {
                item.detail.textContent = '无法连接后端服务，请确认项目已启动';
                item.state.textContent = '失败';
                item.state.className = 'state error';
            }
        }

        const allSucceeded = successCount === selectedFiles.length;
        showSummary(`处理完成：成功 ${successCount} 首，失败 ${selectedFiles.length - successCount} 首`, allSucceeded);
        submitBtn.disabled = false;
        submitBtn.textContent = '生成小压缩 MP3';
    });

    function createResultItem(file) {
        const root = document.createElement('div');
        root.className = 'result';
        const info = document.createElement('div');
        const name = document.createElement('div');
        name.className = 'result-name';
        name.textContent = file.name;
        const detail = document.createElement('div');
        detail.className = 'result-detail';
        detail.textContent = `${formatBytes(file.size)} · 等待处理`;
        const state = document.createElement('div');
        state.className = 'state loading';
        state.textContent = '处理中…';
        info.append(name, detail);
        root.append(info, state);
        return { root, detail, state };
    }

    function formatBytes(bytes) {
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KiB`;
        return `${(bytes / 1024 / 1024).toFixed(2)} MiB`;
    }

    function showSummary(message, ok) {
        summary.textContent = message;
        summary.className = `summary show ${ok ? 'ok' : 'fail'}`;
    }

    function hideSummary() {
        summary.textContent = '';
        summary.className = 'summary';
    }
</script>
</body>
</html>
